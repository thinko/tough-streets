version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Containerfile.dev
    volumes:
      - .:/app
    environment:
      - TZ=UTC
      - LOG_LEVEL=debug
    ports:
      - "9090:9090"
      - "53:53/tcp"
      - "53:53/udp"
      - "2345:2345"
    cap_add:
      - NET_ADMIN  # Required for DHCP to work
      - NET_RAW    # Required for packet capture
      - NET_BIND_SERVICE # Required to bind to privileged ports
    network_mode: "host"  # For DHCP to work properly
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  esdata:
    driver: local
